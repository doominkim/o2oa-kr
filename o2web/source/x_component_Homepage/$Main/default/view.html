<div class="o2_homepage_content" data-o2-element="node">
    <div class="o2_homepage_layout_side" data-o2-element="sideLayout">
        <div class="o2_homepage_card o2_homepage_myinfo_content" data-o2-element="myInfoNode">
            <div class="o2_homepage_myinfo_title">{{$.lp.myInfo}}</div>
            <div class="o2_homepage_myinfo_avatar" data-o2-element="myInfoAvatarNode"></div>
            <div class="o2_homepage_myinfo_name" data-o2-element="myInfoNameNode"></div>
            <div class="o2_homepage_myinfo_unit" data-o2-element="myInfoUnitNode"></div>
            <div class="o2_homepage_myinfo_date" data-o2-element="myInfoDateNode"></div>
        </div>
        <div class="o2_homepage_card o2_homepage_meeting_content" data-o2-element="meetingContentNode"></div>
    </div>
    <div class="o2_homepage_layout_right" data-o2-element="rightLayout">
        <div class="o2_homepage_card o2_homepage_calendar_content" data-o2-element="calendarContentNode"></div>
    </div>
    <div class="o2_homepage_layout_left">
        <div class="o2_homepage_layout_leftTop" data-o2-element="ltlLayout">
            <div class="o2_homepage_card o2_homepage_task_content" data-o2-element="taskContentNode"></div>
        </div>
        <div class="o2_homepage_layout_leftBottom">
            <div class="o2_homepage_layout_leftBottomLeft" data-o2-element="lblLayout">
                <div class="o2_homepage_card o2_homepage_infor_content" data-o2-element="inforContentNode"></div>
            </div>
            <div class="o2_homepage_layout_leftBottomRight" data-o2-element="lbrLayout">
                <div class="o2_homepage_card o2_homepage_file_content" data-o2-element="fileContentNode"></div>
            </div>
        </div>
    </div>
</div>
