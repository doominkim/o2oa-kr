<div style="background-color: #FFF; overflow: hidden">
	<div title="기본" class="MWFTab">
        <table width="100%" border="0" cellpadding="5" cellspacing="0" class="editTable">
            <tr>
                <td class="editTableTitle">식별자:</td>
                <td class="editTableValue"><input type="text" name="id" value="text{$.id}" class="editTableInput"/></td>
            </tr>
            <tr>
                <td class="editTableTitle">이름:</td>
                <td class="editTableValue"><input type="text" name="name" value="text{$.name}" class="editTableInput"/></td>
            </tr>
            <tr>
                <td class="editTableTitle">설명:</td>
                <td class="editTableValue"><input type="text" name="description" value="text{$.description}" class="editTableInput"/></td>
            </tr>
            <tr>
                <td class="editTableTitle">읽기 전용:</td>
                <td class="editTableValue">
                    <input type="radio" name="isReadonly" value="true" text{($.isReadonly)?'checked':''}/>예
                    <input type="radio" name="isReadonly" value="false" text{(!$.isReadonly)?'checked':''}/>아니요
                </td>
            </tr>
        </table>
        <br/>

		<div class="MWFMaplist" name="styles" title="스타일"></div>
        <div class="MWFMaplist" name="inputStyles" title="Input 스타일"></div>
		<div class="MWFMaplist" name="properties" title="속성"></div>

        <div style="height: 28px; font-weight: bold; line-height:28px; background-color: #EEE; padding: 0px 6px; border-top: 1px solid #999">기본값: </div>
        <table width="100%" border="0" cellpadding="5" cellspacing="0" class="editTable">
            <tr>
                <td class="editTableTitle">계산:</td>
                <td class="editTableValue">
                    <input type="radio" name="compute" value="create" text{($.compute.indexOf('create')!=-1)?'checked':''}/>생성
                    <input type="radio" name="compute" value="save" text{($.compute.indexOf('save')!=-1)?'checked':''}/>저장
                    <input type="radio" name="compute" value="show" text{($.compute.indexOf('show')!=-1)?'checked':''}/>표시
                </td>
            </tr>
        </table>
        <table width="100%" border="0" cellpadding="5" cellspacing="0" class="editTable">
            <tr>
                <td class="editTableTitle">사용자 식별자:</td>
                <td class="editTableValue">
                    <div class="MWFPersonIdentity" name="identityValue"></div>
                </td>
            </tr>
            <tr>
                <td class="editTableTitle">조직:</td>
                <td class="editTableValue">
                    <div class="MWFPersonUnit" name="unitValue" type="unit"></div>
                </td>
            </tr>
            <!--<tr>-->
                <!--<td class="editTableTitle">부서:</td>-->
                <!--<td class="editTableValue">-->
                    <!--<div class="MWFPersonDepartment" name="departmentValue" type="department"></div>-->
                <!--</td>-->
            <!--</tr>-->
            <!--<tr>-->
                <!--<td class="editTableTitle">회사:</td>-->
                <!--<td class="editTableValue">-->
                    <!--<div class="MWFPersonCompany" name="companyValue" type="company"></div>-->
                <!--</td>-->
            <!--</tr>-->
            <tr>
                <td class="editTableTitle">직위:</td>
                <td class="editTableValue">
                    <div class="MWFDutySelector" name="dutyValue"></div>
                </td>
            </tr>
        </table>

		<div class="MWFFormulaArea" name="defaultValue" title="기본값 스크립트 (S)"></div>

        <div class="MWFValidation" name="validationConfig"></div>
        <div class="MWFScriptArea" name="validation" title="검증 스크립트 (S)"></div>

	</div>
    <div title="선택" class="MWFTab">
        <div style="height: 24px; line-height:24px; font-weight:bold;background-color: #DDD; border-top:1px solid #999; padding: 0px 6px">사용자 선택 설정</div>
        <table width="100%" border="0" cellpadding="5" cellspacing="0" class="editTable">
            <tr>
                <td class="editTableTitle">선택 범위:</td>
                <td class="editTableValue">
                    <input type="radio" onclick="if (this.checked) {$('text{$.pid}rangeNextArea').setStyle('display', 'none'); $('text{$.pid}rangeScriptValue').setStyle('display', 'none');}" name="range" value="all" text{(['unit', 'draftUnit', 'currentUnit'].indexOf($.range)==-1)?'checked':''}/>전체<br/>
                    <input type="radio" onclick="if (this.checked) {$('text{$.pid}rangeNextArea').setStyle('display', 'none'); $('text{$.pid}rangeScriptValue').setStyle('display', 'block');}" name="range" value="unit" text{($.range.indexOf('unit')!=-1)?'checked':''}/>지정 조직<br/>
                    <input type="radio" onclick="if (this.checked) {$('text{$.pid}rangeNextArea').setStyle('display', 'block'); $('text{$.pid}rangeScriptValue').setStyle('display', 'none');}" name="range" value="draftUnit" text{($.range.indexOf('draftUnit')!=-1)?'checked':''}/>기안자 소속 조직<br/>
                    <input type="radio" onclick="if (this.checked) {$('text{$.pid}rangeNextArea').setStyle('display', 'block'); $('text{$.pid}rangeScriptValue').setStyle('display', 'none');}" name="range" value="currentUnit" text{($.range.indexOf('currentUnit')!=-1)?'checked':''}/>현재 사용자 소속 조직<br/>

                    <div id="text{$.pid}rangeNextArea" style="border-top: 1px solid #999; display: text{($.range=='draftUnit' || $.range=='currentUnit')?'block':'none'}; ">
                        <input type="radio" name="rangeNext" value="direct" text{(['level', 'type'].indexOf($.rangeNext)==-1)?'checked':''}/>직속 조직<br/>
                        <input type="radio" name="rangeNext" value="level" text{(($.rangeNext) && $.rangeNext.indexOf('level')!=-1)?'checked':''}/>상위
                        <div style="display: inline"><select name="rangeNextLevel">
                            <option value="1" text{($.rangeDraftLevel=='1')?'selected':''}>1</option>
                            <option value="2" text{($.rangeDraftLevel=='2')?'selected':''}>2</option>
                            <option value="3" text{($.rangeDraftLevel=='3')?'selected':''}>3</option>
                            <option value="4" text{($.rangeDraftLevel=='4')?'selected':''}>4</option>
                            <option value="5" text{($.rangeDraftLevel=='5')?'selected':''}>5</option>
                            <option value="6" text{($.rangeDraftLevel=='6')?'selected':''}>6</option>
                            <option value="7" text{($.rangeDraftLevel=='7')?'selected':''}>7</option>
                            <option value="8" text{($.rangeDraftLevel=='8')?'selected':''}>8</option>
                            <option value="9" text{($.rangeDraftLevel=='9')?'selected':''}>9</option>
                        </select>단계 조직</div><br/>
                        <input style="float: left" type="radio" name="rangeNext" value="type" text{(($.rangeNext) && $.rangeNext.indexOf('type')!=-1)?'checked':''}/>유형이
                        <div class="MWFFormUnitTypeSelector" name="rangeNextUnitType" style="display: inline"></div>
                        인 조직<br/>
                    </div>
                </td>
            </tr>
            <tr>
                <td class="editTableTitle">선택 개수:</td>
                <td class="editTableValue"><input type="text" name="count" value="text{$.count}" class="editTableInput"/></td>
            </tr>
            <tr>
                <td class="editTableTitle">선택 유형:</td>
                <td class="editTableValue">
                    <input onclick="if (this.checked) $('text{$.pid}unitTypeSelect').setStyle('display', 'none');" type="radio" name="selectType" value="identity" text{($.selectType.indexOf('unit')==-1)?'checked':''}/>개인
                    <input onclick="if (this.checked) $('text{$.pid}unitTypeSelect').setStyle('display', 'block');" type="radio" name="selectType" value="unit" text{($.selectType.indexOf('unit')!=-1)?'checked':''}/>조직
                    <div id="text{$.pid}unitTypeSelect" style="display: text{($.selectType=='unit')?'block':'none'}; ">
                        <div style="float: left">조직 유형: </div><div class="MWFFormUnitTypeSelector" name="selectUnitType" style="float: left"></div>
                    </div>
                </td>
            </tr>
        </table>

        <div id="text{$.pid}rangeScriptValue" style="border-bottom: 1px solid #999; display: text{($.range=='unit')?'block':'none'}; ">
            <div style="height: 24px; line-height:24px; background-color: #EEE; padding: 0px 6px; border-top: 1px solid #999">양식 데이터로 선택 범위 지정</div>
            <table width="100%" border="0" cellpadding="5" cellspacing="0" class="editTable">
                <tr>
                    <td class="editTableTitle">양식 데이터:</td>
                    <td class="editTableValue"><div class="MWFFormFieldPerson" name="rangeField" type="formField"></div></td>
                </tr>
            </table>

            <div style="height: 24px; line-height:24px; background-color: #EEE; padding: 0px 6px; border-top: 1px solid #999">스크립트로 선택 범위 지정</div>
            <div class="MWFScriptArea" name="rangeKey" title="스크립트 (S)"></div>
        </div>
    </div>
    <div title="섹션" class="MWFTab">
        <table width="100%" border="0" cellpadding="5" cellspacing="0" class="editTable">
            <tr>
                <td class="editTableTitle">섹션 사용:</td>
                <td class="editTableValue">
                    <input onclick="if (this.checked){ $('text{$.pid}sectionByEditArea').setStyle('display', 'block')}" type="radio" name="section" value="yes" text{($.section=='yes')?'checked':''}/>예
                    <input onclick="if (this.checked){ $('text{$.pid}sectionByEditArea').setStyle('display', 'none')}" type="radio" name="section" value="no" text{($.section!='yes')?'checked':''}/>아니요
                </td>
            </tr>
        </table>

        <div id="text{$.pid}sectionByEditArea" style="display: text{($.section=='yes')?'block':'none'};">
            <table width="100%" border="0" cellpadding="5" cellspacing="0" class="editTable">
                <tr>
                    <td class="editTableTitle">섹션 기준:</td>
                    <td class="editTableValue">
                        <input class="editTableRadio" onclick="if (this.checked){ $('text{$.pid}sectionByScriptEditArea').setStyle('display', 'none');}" name="sectionBy" text{(($.sectionBy=='person') || ($.sectionBy!='unit' && $.sectionBy!='activity' && $.sectionBy!='script'))?'checked':''} type="radio" value="person"/>처리자<br/>
                        <input class="editTableRadio" onclick="if (this.checked){ $('text{$.pid}sectionByScriptEditArea').setStyle('display', 'none');}"  name="sectionBy" text{($.sectionBy=='unit')?'checked':''} type="radio" value="unit"/>처리자 소속 조직<br/>
                        <input class="editTableRadio" onclick="if (this.checked){ $('text{$.pid}sectionByScriptEditArea').setStyle('display', 'none');}"  name="sectionBy" text{($.sectionBy=='activity')?'checked':''} type="radio" value="activity"/>활동 ID<br/>
                        <input class="editTableRadio" onclick="if (this.checked){ $('text{$.pid}sectionByScriptEditArea').setStyle('display', 'block');}"  name="sectionBy" text{($.sectionBy=='script')?'checked':''} type="radio" value="script"/>스크립트<br/>
                    </td>
                </tr>
            </table>
            <div id="text{$.pid}sectionByScriptEditArea" style="display: text{($.sectionBy=='script')?'block':'none'};">
                <div class="MWFScriptArea" name="sectionByScript" title="섹션 기준 (S)"></div>
            </div>
        </div>
    </div>
	<div title="이벤트"  class="MWFTab">
		<div class="MWFEventsArea" name="events"></div>
	</div>
	<div title="HTML"  class="MWFTab">
		<div class="MWFHTMLArea" style="font-family: Verdana, Geneva, sans-serif; font-size:14px"></div>
	</div>
</div>
