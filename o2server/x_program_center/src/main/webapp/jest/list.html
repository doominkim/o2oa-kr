	<script>
		function tableStructure(){
			var entityMap = new Map();
			entityMap.set("x_attendance_core_entity", "근태 관련");
			entityMap.set("x_bbs_core_entity", "포럼 관련");
			entityMap.set("x_calendar_core_entity", "일정 관리 관련");
			entityMap.set("x_cms_core_entity", "콘텐츠 관리 관련");
			entityMap.set("x_component_core_entity", "컴포넌트 관리 관련");
			entityMap.set("x_correlation_core_entity", "관련 문서 관련");
			entityMap.set("x_file_core_entity", "클라우드 파일 관련");
			entityMap.set("x_general_core_entity","자주 쓰는 기능 관련");
			entityMap.set("x_ai_core_entity","AI 대규모 모델 연동 관련");
			entityMap.set("x_hotpic_core_entity", "핫 이슈 관련");
			entityMap.set("x_jpush_core_entity", "JPush 푸시");
			entityMap.set("x_meeting_core_entity", "회의 관리 관련");
			entityMap.set("x_message_core_entity", "메시지 통신 관련");
			entityMap.set("x_mind_core_entity", "마인드맵 모듈 관련");
			entityMap.set("x_okr_core_entity", "실행력 관련");
			entityMap.set("x_organization_core_entity", "조직 관리 관련");
			entityMap.set("x_portal_core_entity", "포털");
			entityMap.set("x_processplatform_core_entity", "프로세스 플랫폼");
			entityMap.set("x_program_center_core_entity", "센터 서비스");
			entityMap.set("x_query_core_entity", "데이터 플랫폼 전문 검색");
			entityMap.set("x_teamwork_core_entity", "팀");
			$(function() {
				$.getJSON('../describe/table/tableList.json?rd=' + Math.random(), function(json) {
					$('#apiTable tbody').append("<tr><td colspan='3'><center id='title' style='font-size:32px; font-weight:bold;'>O2OA Table structure</center></td></tr>");
					for(var key in json){
						var str = '';
						str += '<tr>';
						if(typeof(entityMap.get(key)) == "undefined"){
							str += '<td>' + '</td>';
						}else{
							str += '<td>' + entityMap.get(key) + '</td>';
						}
						str += '<td>' + key + '</td>';
						str += '<td>';
						var url = "./listTableDetail.html?param="+ json[key]
						str += '<a href="'+url+'" target="_blank">' + json[key] + '</a><br/>'; ;
						str += '</td>';
						str += '</tr>';
						$('#apiTable tbody').append(str);
					}
				});
			});
		}

		function getCenterJson(){
		   var centerJson = "";
		   var druidTable = "<tr><td colspan='3'><center id='title' style='font-size:32px; font-weight:bold;'>Druid url</center></td></tr>";
			$.ajax({
				type : 'get',
				dataType : 'json',
				async:false,
				contentType : 'application/json; charset=utf-8',
				url : '../jaxrs/jest/center/list',
				xhrFields : {
					'withCredentials' : true
				},
				crossDomain : true,
				error : function(e){

				}
			}).done(function(json){
				debugger;
				centerJson += '<tr>';
				centerJson += '<td>' + json.data.name + '</td>';
				let classNames = json.data.className.split(".");
				centerJson += '<td>' + classNames[classNames.length-1] + '</td>';
				centerJson += '<td>';
				$.each(json.data.urlList, function(i, url) {
					url = url.replace(/(127.0.0.1)/g, window.location.hostname);
					centerJson += '<a href="'+url+'" target="_blank">' + url + '</a><br/>';
				});
				centerJson += '</td>';
				centerJson += '</tr>';

				druidTable += '<tr>';
				druidTable += '<td>' + 'Druid Monitor' + '</td>';
				druidTable += '<td>' + '' + '</td>';
				druidTable += '<td>';
				$.each(json.data.urlList, function(i, url) {
					url = url.replace(/(127.0.0.1)/g, window.location.hostname);
					url = url.replace(/jest/g, 'druid');
					druidTable += '<a href="'+url+'" target="_blank">' + url + '</a><br/>';
				});
				druidTable += '</td>';
				druidTable += '</tr>';
			})

			return centerJson + druidTable;
		}

		$(function() {
			$.ajax({
				type : 'get',
				dataType : 'json',
				contentType : 'application/json; charset=utf-8',
				url : '../jaxrs/jest/list',
				xhrFields : {
					'withCredentials' : true
				},
				crossDomain : true,
				error : function(e){
					$('#contentTable').hide();
					$('#content').html("<div align = 'center'>조회 권한이 없습니다. 관리자 신분으로 로그인하십시오!</div>");
				}
			}).done(function(json) {
				if (json.type == 'success') {
					if (json.data) {
						const baseUrl = window.location.protocol + "//" + window.location.host;
						var str = '<table border="1" id = "apiTable" >';
                        str += '<tr><td colspan="3"><center id="title" style="font-size:32px; font-weight:bold;">O2OA Service API URL </center> </td></tr>';
						$.each(json.data, function(index, o) {
							str += '<tr>';
							str += '<td>' + o.name + '</td>';
							let classNames = o.className.split(".");
							let className = classNames[classNames.length-1];
							str += '<td>' + className + '</td>';
							str += '<td>';
							$.each(o.urlList, function(i, url) {
								const appUrl = new URL(url), fullPath = appUrl.pathname;
								url = baseUrl + fullPath;
								str += '<a href="'+url+'" target="_blank">' + url + '</a><br/>';
							});
							str += '</td>';
							str += '</tr>';
						});

						//str += '<tr><td>센터 서비스</td><td>com.x.base.core.project.x_program_center</td><td><a href="http://'+window.location.hostname+':20030/x_program_center/jest/index.html" target="_blank">http://'+window.location.hostname+':20030/x_program_center/jest/index.html</a><br></td></tr>';
						str += getCenterJson();
						str += '</table>';
						$('#content').html(str);
						tableStructure();
					}
				}
			});


		$.ajax({
			type : 'get',
			async : false,
			dataType : 'json',
			contentType : 'application/json; charset=utf-8',
			url : '../jaxrs/jest/version',
			xhrFields : {
				'withCredentials' : true
			},
			crossDomain : true,
			error : function(e){
			}
		}).done(function(json) {
			if (json.type == 'success') {
				 if (json.data) {
					 $('#version').html('<center>version:'+ json.data.version + "&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;date:" +json.data.date + "</center>");
				 }
				}
			 }
		);



		});
	</script>
